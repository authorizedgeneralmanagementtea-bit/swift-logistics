<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swift Logistics</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Swift Logistics</h1>

    <nav>
        <a href="#home">Home</a>
        <a href="#quote">Quote Request</a>
        <a href="#tracking">Track Shipment</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section id="home" class="hero">
    <h2>Fast & Reliable Logistics Solutions</h2>
    <p>Delivering packages safely and on time.</p>
</section>

<section id="quote" class="quote-section">

    <h2>Request a Quote</h2>

    <form>

        <input type="text" placeholder="Full Name" required>

        <input type="email" placeholder="Email Address" required>

        <input type="tel" placeholder="Phone Number">

        <input type="text" placeholder="Pickup Location">

        <input type="text" placeholder="Delivery Location">

        <textarea placeholder="Cargo Details"></textarea>

        <button type="submit">Request Quote</button>

    </form>

</section>

<section id="tracking" class="tracking">

    <h2>Track Shipment</h2>

    <input
        type="text"
        placeholder="Enter Tracking Number">

    <button>Track Package</button>

</section>

<section id="contact" class="contact">

    <h2>Contact Us</h2>

    <p>Email: support@swiftlogistics.com</p>

    <p>Phone: +234 XXX XXX XXXX</p>

</section>

<footer>
    <p>&copy; 2026 Swift Logistics</p>
</footer>

<script src="script.js"></script>

</body>
</html>
